name: docasne-testy
on:
  push:
    branches: [seo-zaklad]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      DATABASE_URL: postgresql://u:p@ep-test.neon.tech/neondb
      NEON_AUTH_BASE_URL: https://auth.example.test
      NEON_AUTH_COOKIE_SECRET: test-cookie-secret-test-cookie-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Testy
        run: npx vitest run 2>&1 | tee /tmp/t.log | grep -E "Test Files|Tests |FAIL|AssertionError" | head -40
      - name: Detail
        run: npx vitest run 2>&1 | grep -A25 -E "FAIL|AssertionError" | head -120 || true
      - name: Build
        run: npx next build 2>&1 | tail -5
      - name: Prohlížeč
        run: |
          npm i -g playwright@1.49.1 >/dev/null 2>&1 && playwright install --with-deps chromium >/dev/null 2>&1
          E2E_CATALOG_SQL=31_sirupy.sql,41_polevky.sql,51_caje.sql,61_zmrzliny.sql,71_ovocne_napoje.sql PORT=3100 NODE_OPTIONS="--import ./scripts/eshop-e2e/neon-http-pglite.mjs" npx next start -p 3100 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          export PLAYWRIGHT_MODULE=$(npm root -g)/playwright/index.mjs
          OUT_DIR=/tmp/x node scripts/eshop-e2e/seo.mjs 3100 | tail -40 || true
          OUT_DIR=/tmp/x node scripts/eshop-e2e/sdileni.mjs 3100 | tail -15 || true
          cd /tmp/k && tar czf /tmp/s.tgz $(ls *.jpg *.png 2>/dev/null) && echo "=====BEGIN S" && base64 -w 2000 /tmp/s.tgz && echo "=====END S"
