name: docasne
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/eshop/shipping.ts lib/eshop/operator.ts lib/eshop/checkout.ts
        if: always()
      - run: npx vitest run lib/eshop lib/site
        if: always()
