# DOČASNÉ — ověření větve eshop/polevky-informace v prohlížeči. Před sloučením se smaže.
name: docasne-testy
on:
  push:
    branches: [eshop/polevky-informace]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      DATABASE_URL: postgresql://u:p@ep-test.neon.tech/neondb
      NEON_AUTH_BASE_URL: https://auth.example.test
      NEON_AUTH_COOKIE_SECRET: test-cookie-secret-test-cookie-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Build
        run: npx next build 2>&1 | tail -5
      - name: Prohlížeč
        run: |
          npm i -g playwright@1.49.1 >/dev/null 2>&1 && playwright install --with-deps chromium >/dev/null 2>&1
          PORT=3100 NODE_OPTIONS="--import ./scripts/eshop-e2e/neon-http-pglite.mjs" npx next start -p 3100 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          PLAYWRIGHT_MODULE=$(npm root -g)/playwright/index.mjs node scripts/eshop-e2e/polevka-info.mjs 3100 || (tail -30 /tmp/server.log; true)
          tar czf /tmp/hero.tgz -C /tmp hero && echo "=====BEGIN HERO" && base64 -w 2000 /tmp/hero.tgz && echo "=====END HERO"
