name: docasne-testy
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: DATABASE_URL=postgres://x:x@localhost/x npx drizzle-kit generate --name mereni_eshopu
      - run: |
          for f in $(git status --short drizzle | awk '{print $2}'); do echo "SOUBOR $f $(gzip -c $f | base64 -w0)"; done
