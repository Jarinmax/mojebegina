name: docasne
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/eshop/cafePage.ts lib/eshop/productFacts.ts "app/eshop/pro-kavarny/page.tsx" "app/eshop/produkt/[slug]/page.tsx"
        if: always()
      - run: npx vitest run lib/eshop/__tests__/cafePage.test.ts lib/eshop/__tests__/productFacts.test.ts components/__tests__/HomeHero.test.tsx
        if: always()
