name: docasne
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
        if: always()
      - run: npx eslint app/api/cron/kampan-set app/rizeni-firmy/kampan-set lib/eshop/setCampaign.ts lib/eshop/setCampaignServer.ts lib/eshop/tastingSet.ts lib/eshop/tastingSetServer.ts lib/eshop/coupons.ts lib/eshop/fioSync.ts lib/eshop/__tests__/fioSync.test.ts components/eshop/TastingSetForm.tsx components/eshop/ProductCard.tsx "app/eshop/produkt/[[]slug]/page.tsx"
        if: always()
      - run: npx vitest run lib/eshop/__tests__/setCampaign.test.ts lib/eshop/__tests__/tastingSet.test.ts lib/eshop/__tests__/coupons.test.ts lib/eshop/__tests__/zasilkovnaCheckout.test.ts lib/eshop/__tests__/fioSync.test.ts lib/etikety lib/site/__tests__/routing.test.ts lib/eshop/__tests__/eshopPaths.test.ts lib/idoklad-read
        if: always()
