# DOČASNÉ — ověření větve prace/kontrola-poznamky (lokálně nejdou nainstalovat
# balíčky). Před sloučením do main se smaže.
name: docasne-testy
on:
  push:
    branches: [prace/kontrola-poznamky]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Typy (jen nové chyby)
        run: npx tsc --noEmit 2>&1 | grep -v "PageProps\|RouteContext\|LayoutProps\|logo-begina-mark" || true
      - name: Testy
        run: |
          npx vitest run > /tmp/v.txt 2>&1 || true
          grep -E "FAIL |Test Files|Tests  " /tmp/v.txt | sort -u | head -40
          npx vitest run lib/data/__tests__/eshopCheck.integration.test.ts app/prace 2>&1 | grep -E "✓|×|FAIL|Error|Expected|Received|^\s+[-+] " | head -40
