name: docasne-testy
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: DATABASE_URL=postgres://x:x@localhost/x npx drizzle-kit generate --name ekonomika
      - run: |
          git status --short
          for f in drizzle/0040_ekonomika.sql drizzle/meta/0040_snapshot.json drizzle/meta/_journal.json; do echo "SOUBOR $f $(gzip -c $f | base64 -w0)"; done
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/ekonomika app/rizeni-firmy/ekonomika
      - run: npx vitest run lib/ekonomika
