# DOČASNÉ — ověření hlavičky na produkčním begina.cz (jen čtení). Smaže se.
name: docasne-testy
on:
  push:
    branches: [over-hlavicka-produkce]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Produkce begina.cz
        run: |
          npm i -g playwright@1.49.1 >/dev/null 2>&1 && playwright install --with-deps chromium >/dev/null 2>&1
          PLAYWRIGHT_MODULE=$(npm root -g)/playwright/index.mjs OUT_DIR=/tmp/prod node scripts/eshop-e2e/hlavicka-produkce.mjs || true
          cd /tmp/prod && tar czf /tmp/s.tgz *.png && echo "=====BEGIN S" && base64 -w 2000 /tmp/s.tgz && echo "=====END S"
