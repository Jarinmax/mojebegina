name: docasne-testy
on:
  push:
    branches: [over-sdileni-produkce]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Produkce begina.cz
        run: |
          npm i -g playwright@1.49.1 >/dev/null 2>&1 && playwright install --with-deps chromium >/dev/null 2>&1
          curl -sA "WhatsApp/2.23.20.0 A" https://begina.cz/ | grep -oE '<meta (property|name)="(og|twitter):[^>]+>' | head -20
          curl -sI "https://begina.cz/og-begina.png?v=2026-11-10" | grep -iE "^HTTP|content-type|content-length|cache"
          curl -s https://begina.cz/favicon.ico | md5sum
          PLAYWRIGHT_MODULE=$(npm root -g)/playwright/index.mjs SHARE_BASE=https://begina.cz OUT_DIR=/tmp/k node scripts/eshop-e2e/sdileni.mjs 3100 || true
          cd /tmp/k && tar czf /tmp/s.tgz *.png && echo "=====BEGIN S" && base64 -w 2000 /tmp/s.tgz && echo "=====END S"
