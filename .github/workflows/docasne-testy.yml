name: docasne-testy
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          DATABASE_URL=postgres://x:x@localhost/x npx drizzle-kit generate --name receptury
          for f in drizzle/0046_receptury.sql drizzle/meta/0046_snapshot.json drizzle/meta/_journal.json; do echo "SOUBOR $f $(gzip -c $f | base64 -w0)"; done
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/receptury app/rizeni-firmy/receptury app/rizeni-firmy/page.tsx scripts/migrate-receptury.mjs
      - run: npx vitest run lib/receptury
