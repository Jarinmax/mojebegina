name: docasne-testy
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx vitest run lib/eshop/__tests__/catalogPolevky.test.ts lib/eshop/__tests__/tomatovaPolevkaSql.test.ts lib/eshop/__tests__/dyneBezOdrudySql.test.ts lib/eshop/__tests__/productionSql.test.ts
