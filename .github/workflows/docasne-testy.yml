name: docasne
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint app/eshop/pro-kavarny lib/eshop/cafePage.ts lib/eshop/cafeInquirySubmit.ts lib/eshop/__tests__/cafePage.test.ts app/eshop/page.tsx app/eshop/layout.tsx app/eshop/sitemap.xml lib/site/routing.ts
        if: always()
      - run: npx vitest run lib/eshop/__tests__/cafePage.test.ts lib/site lib/eshop/__tests__/isolation.test.ts lib/eshop/__tests__/eshopPaths.test.ts lib/data/__tests__/metaLeads.integration.test.ts
        if: always()
