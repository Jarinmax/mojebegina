name: docasne-testy
on:
  push:
    branches: [doruceni-prvni]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx vitest run 2>&1 | tail -80
        if: always()
