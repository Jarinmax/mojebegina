name: docasne-testy
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: DATABASE_URL=postgres://x:x@localhost/x npx drizzle-kit generate --name mereni_eshopu
      - run: |
          git status --short
          for f in drizzle/0041_mereni_eshopu.sql drizzle/meta/0041_snapshot.json drizzle/meta/_journal.json; do echo "SOUBOR $f $(gzip -c $f | base64 -w0)"; done
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/eshop/funnel.ts lib/eshop/funnelActions.ts lib/eshop/funnelClient.ts lib/eshop/funnelServer.ts components/eshop/FunnelBeacon.tsx app/rizeni-firmy/mereni-eshopu
      - run: npx vitest run lib/eshop/__tests__/funnel.test.ts components/eshop lib/site
