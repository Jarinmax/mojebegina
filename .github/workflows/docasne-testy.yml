name: docasne
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/data/purchaseHistory.ts lib/data/purchaseHistorySync.ts app/api/cron/historie-nakupu lib/data/__tests__/purchaseHistory.test.ts
        if: always()
      - run: npx vitest run lib/data/__tests__/purchaseHistory.test.ts lib/agent/__tests__/agentFlow.integration.test.ts lib/idoklad-read
        if: always()
