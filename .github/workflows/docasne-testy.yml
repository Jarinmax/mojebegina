name: docasne-testy
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint app/rizeni-firmy/doprava-kalkulacka lib/eshop/shippingRates.ts
      - run: npx vitest run lib/eshop/__tests__/shippingSk.test.ts lib/eshop/__tests__/shippingRates.test.ts
