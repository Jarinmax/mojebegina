name: docasne-testy
on:
  push:
    branches: [prace-fotky-blob]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Typy
        run: npx tsc --noEmit 2>&1 | grep -E "photoStorage|prace/foto|fotoRoutes" || echo "typy OK"
      - name: Testy
        run: npx vitest run lib/prace app/api/prace lib/data/__tests__/workTasksPhotos 2>&1 | tail -40
