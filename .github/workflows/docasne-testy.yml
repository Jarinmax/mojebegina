name: docasne
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/data/purchaseHistory.ts lib/data/purchaseHistorySync.ts app/eshop/page.tsx app/eshop/layout.tsx components/eshop/MainNav.tsx lib/eshop/homeNav.ts lib/eshop/cafePage.ts
        if: always()
      - run: npx vitest run lib/data/__tests__/purchaseHistory.test.ts lib/eshop/__tests__/cafePage.test.ts lib/eshop/__tests__/homeNav.test.ts
        if: always()
