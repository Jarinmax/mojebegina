# DOČASNÉ — ověření větve eshop/hero-polevka. Před sloučením se smaže.
name: docasne-testy
on:
  push:
    branches: [eshop/hero-polevka]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Typy
        run: npx tsc --noEmit 2>&1 | grep -v "PageProps\|RouteContext\|LayoutProps\|logo-begina-mark" || true
      - name: Testy
        run: |
          npx vitest run > /tmp/v.txt 2>&1 || true
          grep -E "FAIL |Test Files|Tests  " /tmp/v.txt | sort -u | head -40
          npx vitest run components/__tests__/HomeHero.test.tsx 2>&1 | tail -25
      - name: Build
        env:
          DATABASE_URL: postgresql://u:p@ep-test.neon.tech/neondb
        run: npx next build 2>&1 | tail -30
      - name: Prohlížeč
        env:
          DATABASE_URL: postgresql://u:p@ep-test.neon.tech/neondb
        run: |
          npm i -g playwright@1.49.1 >/dev/null 2>&1 && playwright install --with-deps chromium >/dev/null 2>&1
          PORT=3100 NODE_OPTIONS="--import ./scripts/eshop-e2e/neon-http-pglite.mjs" npx next start -p 3100 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          PLAYWRIGHT_MODULE=$(npm root -g)/playwright/index.mjs node scripts/eshop-e2e/hero.mjs 3100 || (tail -40 /tmp/server.log; true)
          tar czf /tmp/hero.tgz -C /tmp hero && echo "=====BEGIN HERO" && base64 -w0 /tmp/hero.tgz && echo && echo "=====END HERO"
