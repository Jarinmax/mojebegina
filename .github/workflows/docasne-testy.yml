# DOČASNÉ — ověření větve lucie/fakturacni-udaje (lokálně nejdou nainstalovat
# balíčky). Před sloučením do main se smaže.
name: docasne-testy
on:
  push:
    branches: [lucie/fakturacni-udaje]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Migrace (drizzle-kit generate)
        env:
          DATABASE_URL: postgresql://u:p@localhost/x
        run: |
          if ! ls drizzle/0034_*.sql >/dev/null 2>&1; then npx drizzle-kit generate --name eshop_fakturacni_udaje; fi
          git status --short drizzle
          tar czf /tmp/mig.tgz drizzle/0034_*.sql drizzle/meta/0034_snapshot.json drizzle/meta/_journal.json && echo "=====BEGIN MIG" && base64 -w0 /tmp/mig.tgz && echo && echo "=====END MIG"
      - name: Typy (jen nové chyby)
        run: npx tsc --noEmit 2>&1 | grep -v "PageProps\|RouteContext\|LayoutProps\|logo-begina-mark" || true
      - name: Testy
        run: |
          npx vitest run > /tmp/v.txt 2>&1 || true
          grep -E "FAIL |Test Files|Tests  " /tmp/v.txt | sort -u | head -80
          grep -nE "AssertionError|Error:" /tmp/v.txt | head -60
      - name: Náhled e-mailů
        run: |
          RENDER_MAIL_DIR=/tmp/mails npx vitest run lib/eshop/__tests__/fakturacniUdaje.test.ts >/dev/null 2>&1 || true
          tar czf /tmp/mails.tgz -C /tmp mails && echo "=====BEGIN MAILS" && base64 -w0 /tmp/mails.tgz && echo && echo "=====END MAILS"
