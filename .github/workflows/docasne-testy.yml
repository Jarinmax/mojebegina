name: nahledy
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/eshop/productFacts.ts lib/eshop/catalogDb.ts lib/eshop/homeContent.ts components/eshop/HomeHero.tsx components/eshop/ProductCard.tsx "app/eshop/produkt/[slug]/page.tsx"
      - run: npx vitest run lib/eshop components/__tests__/HomeHero.test.tsx
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir shots && cd shots && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install chromium >/dev/null
          cat > s.mjs <<'JS'
          import { chromium, devices } from "playwright";
          const B = "https://begina.cz";
          const inject = (cfg) => {
            const svg = (inner, size, color) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${inner}</svg>`;
            const CHECK = '<path d="M20 6 9 17l-5-5"/>';
            const CLOCK = '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>';
            const wide = window.innerWidth >= 640, desk = window.innerWidth >= 1024;
            const h1 = document.querySelector("h1");
            if (cfg.home && h1) {
              const ul = document.createElement("ul");
              ul.style.cssText = `margin-top:${wide ? 16 : 8}px;display:flex;flex-wrap:wrap;align-items:center;justify-content:${desk ? "flex-start" : "center"};column-gap:${wide ? 20 : 12}px;row-gap:4px;font-size:${wide ? 16 : 13}px;font-weight:500;color:#4A5527;list-style:none;padding:0`;
              ul.innerHTML = ["Polévky a čaje vydrží 14 dní po otevření", "100% rostlinné", "Chlazeně až domů"].map((t) => `<li style="display:inline-flex;align-items:center;gap:4px">${svg(CHECK, wide ? 20 : 16, "#4A5527")}${t}</li>`).join("");
              h1.after(ul);
              for (const p of document.querySelectorAll("p")) {
                if (p.textContent.replace(/\u00a0/g, " ").trim() === "Čerstvě. Jednoduše. S chutí.") { p.remove(); continue; }
                if (p.textContent.includes("Natočíte si, kolik chcete")) p.innerHTML = "Natočíte si, kolik chcete a&nbsp;kdy chcete. Z&nbsp;čisté filtrované vody.";
                if (p.textContent.trim() === "Doručujeme chlazenou přepravou.") p.remove();
              }
              const h3 = [...document.querySelectorAll("h3")].find((e) => e.textContent.trim() === "Vydrží i po otevření");
              const li = h3 && h3.closest("li");
              if (li) li.parentElement.prepend(li);
            }
            if (cfg.badges) {
              for (const h2 of document.querySelectorAll("li h2")) {
                const badge = cfg.badges[h2.textContent.trim()] ?? cfg.badges["*"];
                if (!badge) continue;
                const p = document.createElement("p");
                p.style.cssText = "margin-top:6px;display:inline-block;border-radius:9999px;background:#F1EFE3;padding:2px 8px;font-size:12px;line-height:16px;font-weight:500;color:#4A5527";
                p.textContent = badge;
                h2.parentElement.append(p);
              }
            }
            if (cfg.product) {
              for (const p of document.querySelectorAll("p,span")) if (!p.children.length && /^\d+–\d+ (nápoje|sklenice)$/.test(p.textContent.trim())) p.remove();
              for (const p of document.querySelectorAll("p")) if (/Kč za (porci|nápoj)\)/.test(p.textContent) && !p.children.length) p.textContent = p.textContent.replace(/\s*\((?:cca\s*)?\d[\d\s,]*Kč za (?:porci|nápoj|sklenici)\)/g, "");
              const price = [...document.querySelectorAll("p")].find((p) => p.className.includes("text-2xl") && p.className.includes("font-semibold"));
              const box = document.createElement("div");
              box.style.cssText = "margin-top:12px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:20px;color:#404040";
              box.innerHTML = `<p style="display:flex;align-items:flex-start;gap:8px">${svg(CLOCK, 16, "#5E6B34").replace('style="', 'style="margin-top:2px;')}${cfg.product.opened}</p>` + cfg.product.portions.map(([l, t]) => `<p style="padding-left:24px;font-variant-numeric:tabular-nums">${l ? `<span style="color:#737373">${l}: </span>` : ""}${t}</p>`).join("");
              price.after(box);
              if (cfg.product.noPreservatives) {
                const ul = box.nextElementSibling;
                if (ul && ul.tagName === "UL") { const li = ul.lastElementChild.cloneNode(true); li.lastChild.textContent = "bez konzervantů"; ul.append(li); }
              }
              if (cfg.product.bold) {
                const dt = [...document.querySelectorAll("dt")].find((e) => e.textContent.trim() === "Složení");
                const dd = dt.nextElementSibling;
                dd.innerHTML = dd.innerHTML.replace(cfg.product.bold, `<strong>${cfg.product.bold}</strong>`);
              }
            }
          };
          const S14 = "Po otevření vydrží v lednici 14 dní – natáčíte postupně.";
          const b = await chromium.launch();
          {
            const ctx = await b.newContext({ ...devices["iPhone 13"] });
            const p = await ctx.newPage();
            const go = async (path, cfg) => { await p.goto(B + path, { waitUntil: "networkidle" }); await p.addStyleTag({ content: ".cky-consent-container,.cky-overlay,.cky-btn-revisit-wrapper{display:none!important}" }); await p.evaluate(inject, cfg); await p.waitForTimeout(300); };
            const top = () => p.evaluate(() => { const h = document.querySelector("h1"); window.scrollTo(0, h.getBoundingClientRect().top + window.scrollY - 90); });
            await go("/", { home: true, badges: { "Dýňová polévka": "14 dní po otevření", "Bylinný sirup Šaman": "3 měsíce po otevření", "Lipový sirup": "3 měsíce po otevření", "Svařák Deluxe": "14 dní po otevření" } });
            await p.screenshot({ type: 'jpeg', quality: 75, path: "n1-uvod.jpg" });
            await go("/produkt/dynova-polevka", { product: { opened: S14, portions: [[null, "Porce 250 ml za 31,60 Kč · 126 Kč/l"]], noPreservatives: true } });
            await top(); await p.screenshot({ type: 'jpeg', quality: 75, path: "n2-polevka.jpg" });
            await go("/produkt/kosmopolitan", { product: { opened: "Po otevření vydrží v lednici 14 dní.", portions: [["3 l", "Sklenice 200 ml za 53,30 Kč · 266 Kč/l"], ["500 ml", "Sklenice 200 ml za 67,60 Kč · 338 Kč/l"]], noPreservatives: true } });
            await top(); await p.screenshot({ type: 'jpeg', quality: 75, path: "n3-koktejl.jpg" });
            await ctx.close();
          }
          await b.close();
          console.log("VYSLEDEK hotovo");
          JS
          node s.mjs
          for f in *.jpg; do echo "SOUBOR $f $(base64 -w0 $f)"; done
