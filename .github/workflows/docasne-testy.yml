# DOČASNÉ — jen pro ověření větve lucie/obchodni-podminky-odstoupeni
# (v prostředí, kde úpravy vznikly, nejdou nainstalovat balíčky). Před
# sloučením do main se smaže.
name: docasne-testy
on:
  push:
    branches: [lucie/obchodni-podminky-odstoupeni]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: PDF ke kontrole
        run: npx tsx scripts/tmp/export-pdf.mts
      - name: PDF do logu (base64)
        run: for f in out/*.pdf; do echo "=====BEGIN $f"; base64 -w0 "$f"; echo; echo "=====END $f"; done
      - name: Testy (jen podmínky a patička)
        run: npx vitest run lib/eshop/__tests__/termsVersions.test.ts components/__tests__/EshopFooter.test.tsx
