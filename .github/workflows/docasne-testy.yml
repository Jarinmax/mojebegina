name: docasne-testy
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/eshop/productFacts.ts lib/eshop/__tests__/productFacts.test.ts lib/eshop/homeContent.ts components/eshop "app/eshop/produkt/[slug]/page.tsx" app/eshop/page.tsx
      - run: npx vitest run lib/eshop/__tests__/productFacts.test.ts components/__tests__ app/eshop
