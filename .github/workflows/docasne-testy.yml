name: docasne
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint lib/eshop/invoicing/afterPaid.ts lib/data/orders.ts lib/eshop/fioSync.ts app/rizeni-firmy/objednavky/actions.ts lib/agent/mcp/tools/orders.ts lib/eshop/__tests__/invoiceOnDispatch.test.ts
        if: always()
      - run: npx vitest run lib/eshop/__tests__/invoiceOnDispatch.test.ts lib/eshop/__tests__/fioSync.test.ts lib/eshop/__tests__/idokladManual.test.ts lib/eshop/__tests__/idokladLive.test.ts lib/agent/__tests__ lib/data
        if: always()
