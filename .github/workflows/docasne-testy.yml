name: docasne-testy
on:
  push:
    branches: [tomatova-polevka]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Testy
        run: npx vitest run 2>&1 | tee /tmp/t.log | grep -E "Test Files|Tests |FAIL|×|AssertionError|Expected|Received" | head -40; ! grep -q "Test Files .*failed" /tmp/t.log
