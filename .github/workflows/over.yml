name: over
on: push
jobs:
  o:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const w of [390, 375]) {
            const m = await b.newPage({ viewport: { width: w, height: 645 }, deviceScaleFactor: 2, isMobile: true });
            await m.goto("https://begina.cz/", { waitUntil: "networkidle" });
            console.log("VYSLEDEK " + w + " " + JSON.stringify(await m.evaluate(() => { const n = document.querySelector('nav[aria-label="Kategorie"]').getBoundingClientRect(); return { h1: Math.round(document.querySelector("h1").getBoundingClientRect().top), konecFotky: Math.round(document.querySelector("section img").getBoundingClientRect().bottom), ikony: [Math.round(n.top), Math.round(n.bottom)] }; })));
            if (w === 390) await m.screenshot({ path: "m.jpg", type: "jpeg", quality: 50 });
          }
          await b.close();
          JS
          node s.mjs
          echo "OBRM $(base64 -w0 m.jpg)"
